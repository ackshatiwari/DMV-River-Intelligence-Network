name: Update weather data

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch weather data
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          params = {
              "latitude": "38.94778",
              "longitude": "-77.12764",
              "hourly": ",".join([
                  "precipitation",
                  "rain",
                  "snowfall",
                  "snow_depth",
                  "temperature_2m",
                  "wind_speed_10m",
                  "vapour_pressure_deficit",
              ]),
              "past_days": "4",
              "forecast_days": "1",
              "timezone": "UTC",
          }

          url = "https://api.open-meteo.com/v1/forecast?" + urllib.parse.urlencode(params)

          with urllib.request.urlopen(url, timeout=30) as response:
              weather = json.load(response)

          weather["fetched_at"] = datetime.now(timezone.utc).isoformat()

          output = Path("weather-data/little-falls.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(weather), encoding="utf-8")
          PY

      - name: Commit updated weather data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-data/little-falls.json
          git diff --cached --quiet || git commit -m "Update weather data"
          git push
